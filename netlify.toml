# Netlify config for Video Jigsaw.
# index.html is pre-built (minified + obfuscated from index.src.html) and
# committed, so Netlify serves it directly — no build step needed.
[build]
  command = "echo 'Serving prebuilt index.html'"
  publish = "."

# Don't serve the readable source from the live domain.
[[redirects]]
  from = "/index.src.html"
  to = "/index.html"
  status = 404

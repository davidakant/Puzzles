# Netlify config for Video Jigsaw (GitHub continuous deployment).
#
# On each push Netlify: installs deps, rebuilds index.html from index.src.html
# (minify + obfuscate), then stages only the deployable files into _site/ so
# node_modules and the readable source are never published.
[build]
  command = "npm run build && rm -rf _site && mkdir _site && cp index.html *.mp4 _site/"
  publish = "_site"
